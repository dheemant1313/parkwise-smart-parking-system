name: Parkwise Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Verification & Security Matrix
  # ----------------------------------------------------------------------------
  backend-verification:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite:///${{ github.workspace }}/backend/parkwise_test.db
      JWT_SECRET_KEY: parkwise-ci-test-jwt-secret-key-2026-prod-ready
      QR_HMAC_SECRET: parkwise-ci-test-qr-hmac-secret-2026-prod-ready
      RAZORPAY_KEY_ID: rzp_test_parkwise_in_2026
      RAZORPAY_KEY_SECRET: parkwise-razorpay-sim-secret
      RAZORPAY_WEBHOOK_SECRET: parkwise-razorpay-webhook-secret
      PAYMENT_SIMULATION_MODE: "true"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov email-validator

      - name: Execute Phase 01-07 Core Integration Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_api.py

      - name: Execute Phase 08 Advanced Ecosystem Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase08_ecosystem.py

      - name: Execute Phase 09 Production Readiness & Security Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase09_production_readiness.py

      - name: Execute Phase 10 Map Foundation & Facility Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase10_map_and_facilities.py

      - name: Execute Phase 11 Interactive Driver Map & Outdoor Navigation Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase11_interactive_map_navigation.py

      - name: Execute Phase 12 Live Operator Map & Monitoring Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase12_operator_map_and_monitoring.py

      - name: Execute Phase 13 AI Location Intelligence & Demand Heatmaps Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase13_ai_location_intelligence.py

      - name: Execute Phase 14 Complete Indoor Parking Navigation Tests
        run: |
          cd backend
          python -m pytest -v --tb=short tests/test_phase14_indoor_navigation.py

  # ----------------------------------------------------------------------------
  # 2. Frontend Verification & TypeScript Compilation
  # ----------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Strict TypeScript Compilation Check
        run: |
          cd frontend
          npm run typecheck

      - name: Test Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ----------------------------------------------------------------------------
  # 3. Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: Docker Production Images Build Check
    needs: [backend-verification, frontend-verification]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: parkwise/backend:latest

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: parkwise/frontend:latest
